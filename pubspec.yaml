name: sonioteca
description: "App para ouvir e organizar arquivos mp3"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  path: ^1.9.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.6.4
  build_runner: ^2.13.1

flutter:
  uses-material-design: true